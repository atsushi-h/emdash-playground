name: Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
      CF_SESSION_NAMESPACE_ID: ${{ vars.CF_SESSION_NAMESPACE_ID }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUDIENCE: ${{ vars.CF_ACCESS_AUDIENCE }}
      CF_ALLOWED_EMAIL: ${{ vars.CF_ALLOWED_EMAIL }}
      EMDASH_SITE_URL: ${{ vars.EMDASH_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run build:production
      - name: Deploy existing production resources
        run: bunx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify anonymous requests cannot read the site
        run: node scripts/check-private-site.mjs
